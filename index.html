    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Hide print area on screen */
        #print-area {
            display: none;
        }

        /* Configuration Impression Étiquette 40x20mm */
        @media print {
            @page {
                size: 40mm 20mm;
                margin: 0;
            }
            html, body {
                width: 40mm;
                height: 20mm;
                margin: 0;
                padding: 0;
                background: white;
            }
            body > *:not(#print-area) {
                display: none !important;
            }
            #print-area {
                display: flex !important;
                position: fixed;
                left: 0;
                top: 0;
                width: 40mm;
                height: 20mm;
                padding: 1mm;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                background: white !important;
                color: black !important;
                box-sizing: border-box;
                visibility: visible !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .label-text {
                font-family: 'Courier New', monospace;
                font-size: 8pt;
                line-height: 1.1;
                font-weight: 900;
                text-align: center;
                width: 100%;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                color: #000 !important;
            }
            .label-ref {
                font-size: 10pt;
                font-weight: 900;
                border: 1.5pt solid black;
                padding: 0px 4px;
                margin-bottom: 0.5mm;
                font-family: 'Courier New', monospace;
                color: #000 !important;
                text-transform: uppercase;
            }
        }
    </style>
